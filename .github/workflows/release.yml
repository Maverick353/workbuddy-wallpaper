name: Release

# 打 tag（v*）时：先自验证 → 再产出两个交付物并挂到 Release
#   · workbuddy-wallpaper.zip          源码包（解压 + 双击 .cmd 用）
#   · workbuddy-wallpaper-setup-x.y.z.exe  Inno Setup 安装包（下一步下一步用）
#
# ⚠️ 这个工作流同时也是 **installer/setup.iss 的编译验证**：
#    开发机上没装 Inno Setup，.iss 无法本地编译，所以由 CI 来保证它能编过。
#
# 也可以手动触发（workflow_dispatch）给已存在的 tag 补产物。

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: '要打包并上传产物的 tag（例如 v1.1.0）'
        required: true
        default: 'v1.1.3'

permissions:
  contents: write          # 上传 Release 资产需要

jobs:
  verify:
    name: 发布前自验证
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/verify.js

  package:
    name: 打包并上传产物
    needs: verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 打源码包（zip）
        shell: pwsh
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          git archive --format=zip --prefix=workbuddy-wallpaper/ -o workbuddy-wallpaper.zip $tag
          Write-Host "zip: $((Get-Item workbuddy-wallpaper.zip).Length) bytes"

      - name: 安装 Inno Setup 6
        run: choco install innosetup --no-progress -y

      - name: 取中文向导语言包（有则中文安装界面，取不到自动退回英文）
        continue-on-error: true
        shell: pwsh
        run: |
          # Inno Setup 6 不自带中文向导；官方仓库 issrc 里放着一份。
          # continue-on-error：这一步失败不该让打包整个挂掉（setup.iss 里是条件加载，缺了就英文向导）。
          $dir = "${env:ProgramFiles(x86)}\Inno Setup 6\Languages"
          $url = 'https://raw.githubusercontent.com/jrsoftware/issrc/main/Files/Languages/ChineseSimplified.isl'
          try {
            Invoke-WebRequest -Uri $url -OutFile "$dir\ChineseSimplified.isl" -UseBasicParsing
            Write-Host "已取到中文语言包: $((Get-Item "$dir\ChineseSimplified.isl").Length) bytes"
          } catch {
            Write-Warning "取中文语言包失败（将使用英文向导）: $($_.Exception.Message)"
            exit 0
          }

      - name: 编译 .exe 安装包（同时验证 setup.iss 可编译）
        shell: pwsh
        run: |
          $cands = @(
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe",
            "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe",
            "$env:ProgramFiles\Inno Setup 6\ISCC.exe"
          )
          $iscc = $cands | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw "ISCC.exe not found in any known location" }
          Write-Host "ISCC: $iscc"
          & $iscc "installer\setup.iss"
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }
          Get-ChildItem dist\*.exe | ForEach-Object { Write-Host "exe: $($_.Name) $($_.Length) bytes" }

      - name: 挂到 Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $tag = "${{ github.event.inputs.tag || github.ref_name }}"
          gh release view $tag 2>$null | Out-Null
          if ($LASTEXITCODE -ne 0) {
            Write-Host "release $tag 不存在 → 新建"
            gh release create $tag --title $tag --generate-notes
          } else {
            Write-Host "release $tag 已存在 → 直接上传（保留原有说明）"
          }
          # ⚠️ PowerShell 不会为外部程序展开通配符（git bash 会，这里不会），
          #    所以要自己 Get-ChildItem 取真实路径，否则 gh 收到字面量 dist/*setup*.exe 会报找不到。
          $files = @('workbuddy-wallpaper.zip') + (Get-ChildItem dist\*setup*.exe | ForEach-Object { $_.FullName })
          gh release upload $tag @files --clobber
          gh release view $tag --json assets --jq '.assets[] | "\(.name)  \(.size) bytes"'
